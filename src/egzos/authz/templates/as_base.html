{#- The AS pages' frame (spec/design/consent.md §18): the lifeboat's shell partial by import, never
    forked; no script, no htmx; one stylesheet, linked, so the CSP stays `style-src 'self'`. -#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ stylesheet }}">
</head>
<body>
<div class="{{ frame | default('frame') }}">
{% include "_shell.html" %}
<main>
{% block body %}{% endblock %}
</main>
</div>
</body>
</html>
