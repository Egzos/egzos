[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egzos"
version = "0.1.2"
description = "MCP-first, CLI-first personal context layer"
readme = "README.md"
license = { text = "LicenseRef-PolyForm-Strict-1.0.0" }
requires-python = ">=3.11"
authors = [
    { name = "Ali Sasanian" },
]
dependencies = [
    "typer>=0.27",
    "mcp>=2.2",
    # the lifeboat (spec/design/lifeboat.md §0): FastAPI + Jinja + htmx, in-process
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local ONNX embeddings (lazy download via egzos[embed]).
# Never torch in the base install.
embed = [
    "onnxruntime",
]
dev = [
    "pytest>=8",
    "pyyaml>=6",  # tests/governance imports .github/scripts/check_ownership.py
    "ruff>=0.16,<0.17",  # bounded: the tests gate must not move when ruff's defaults change
    "httpx>=0.27",  # FastAPI's TestClient drives the lifeboat in tests
]

[project.scripts]
egzos = "egzos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/egzos"]
artifacts = [
    "src/egzos/web/tokens.css",
    "src/egzos/web/templates/*.html",
    "src/egzos/web/static/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so the gate is deterministic across ruff releases.
# RUF022 keeps `_types.py`'s `__all__` sorted (#30).
select = ["E", "F", "W", "I", "UP", "B", "C4", "FURB", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# The brand pipeline under spec/ is a design-asset generator, not part of the egzos package
# (see [tool.hatch.build.targets.wheel] packages), written in deliberately dense one-liner style.
# Only the E-class style codes that style trips are waived; F, B and the rest still run there.
# Its conformance gate is pipeline/check.py, run by tests/conformance/test_brand_pipeline.py.
"spec/design/brand/pipeline/*.py" = ["E501", "E701", "E702", "E731", "E741"]
# HTML template strings read better unwrapped.
"src/egzos/web/*.py" = ["E501"]
"src/egzos/authz/presence.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["egzos"]

[tool.pytest.ini_options]
testpaths = ["tests", "adversarial"]
markers = [
    "adversarial: attack-shaped test (see adversarial/README.md)",
    "xfail_finding: known non-security finding (see linked issue)",
]
