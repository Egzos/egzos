# egzos path-ownership map — read by .github/scripts/check_ownership.py
# Schema version 1. Do not edit on an agent branch: chief_only is hard-enforced — the checker and
# this file are both resolved from the base ref per #38, never from the tree under review.

version: 1
branch_prefix: "agent/"

size_cap:
  lines: 600
  files: 30
  exclude:
    - "**/*.lock"
    - "tests/fixtures/**"

# Who may lift the size cap. check_ownership.py honours `size-exception` only when the login that
# last applied it is listed here: the label's presence proves only that someone holding issues:
# write applied it, and egzos-forge holds issues: write (drift F18). The Chief directly, or
# chief-proxy registering the Chief's reply — never an agent identity.
size_exception_approvers:
  - "Gond-ul"
  - "chief-proxy[bot]"

# GitHub identities that open agent PRs. A PR one of these opens is judged by agent rules whatever
# its branch is called: a branch outside branch_prefix fails the check instead of reading as the
# Chief's. The branch name is the agent's choice; the PR author is not.
agent_identities:
  - "egzos-forge[bot]"

# Paths that ONLY the Chief may modify. Any agent branch touching these fails immediately.
# The review register and this map are controls over the agents they govern — an agent that
# could edit either could settle a finding, or widen its own reach, against itself.
# docs/** is otherwise a1p-planner's and haiku-mechanic's to write.
chief_only:
  - "docs/build/REVIEW-DECISIONS.md"
  - ".github/OWNERSHIP.yml"
  # Claude Code loads these at any depth, so a nested one is a control input too, whatever the
  # entry's type (Egzos/egzos-platform#46). `*/**/` needs at least one directory above, so the
  # root CLAUDE.md and .claude/ stay a1p-planner's; `**/.mcp.json` matches the root too, which no
  # agent owned. Residual: a1p-planner can still change the type of the root .claude (a directory
  # for a symlink); the reviewers' cleanup removes it whatever its type and the Chief's approval
  # gates it. A test needing one of these shapes builds it in tmp_path at runtime, never commits it.
  - "*/**/.claude"
  - "*/**/.claude/**"
  - "*/**/CLAUDE.md"
  - "*/**/CLAUDE.local.md"
  - "**/.mcp.json"

# Paths that trigger a ::notice:: annotation when touched (not a failure for a1p-planner).
governance_paths:
  - "CLAUDE.md"
  - ".github/**"
  - ".claude/**"
  - "spec/contracts/**"

agents:
  # Foreman / planner: owns shared files, CI, spec, docs.
  a1p-planner:
    paths:
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/**"
      - ".claude/**"
      - "spec/**"
      - "docs/**"
      - "tests/conftest.py"
      - "tests/test_smoke.py"
      - "tests/_types/**"
      - "tests/governance/**"
      - "src/egzos/__init__.py"
      - "src/egzos/_types.py"
      - "src/egzos/container.py"
      - "CHANGELOG.md"
    exclusive: []

  # Core store: node model, resolver, embeddings, sqlite backend, blob store, .xmb core.
  # The flat skeleton modules map to their owners (the Chief on #150, 2026-10-09).
  a3-store:
    paths:
      - "src/egzos/store/**"
      - "src/egzos/vault/**"
      - "src/egzos/model.py"
      - "src/egzos/resolver.py"
      - "src/egzos/backends/**"
      - "tests/store/**"
      - "tests/vault/**"
    exclusive: []

  # Trust engine: statuses, policies, OAuth 2.1 AS, tokens, presence.
  a3-trust:
    paths:
      - "src/egzos/trust/**"
      - "src/egzos/authz/**"
      - "src/egzos/trust.py"
      - "src/egzos/auth.py"
      - "tests/trust/**"
      - "tests/authz/**"
    exclusive: []

  # Ledger: append-only hash-chained audit, event taxonomy, anomaly primitives.
  a3-ledger:
    paths:
      - "src/egzos/ledger/**"
      - "src/egzos/ledger.py"
      - "tests/ledger/**"
    exclusive: []

  # Doorman: CLI, MCP, REST surface, .xmb verbs, serve --tls.
  a3-doorman:
    paths:
      - "src/egzos/cli/**"
      - "src/egzos/mcp/**"
      - "src/egzos/api/**"
      - "tests/cli/**"
      - "tests/mcp/**"
      - "tests/api/**"
    exclusive: []

  # Dinghy: lifeboat FastAPI + Jinja + htmx web UI.
  a5-dinghy:
    paths:
      - "src/egzos/web/**"
      - "tests/web/**"
    exclusive: []

  # Adversary: security testing. adversarial/** is exclusive — no other agent may touch it.
  a6-adversary:
    paths:
      - "adversarial/**"
    exclusive:
      - "adversarial/**"

  # Haiku mechanic: fixtures, changelogs, docs — low blast-radius mechanical work.
  haiku-mechanic:
    paths:
      - "tests/fixtures/**"
      - "CHANGELOG.md"
      - "docs/**"
    exclusive: []

  # a1r-reviewer: review mode never pushes; build mode (core-queue label agent:a1r-reviewer,
  # forge token) owns the integration + conformance suites the build plan gives A1r.
  a1r-reviewer:
    paths:
      - "tests/integration/**"
      - "tests/conformance/**"
    exclusive: []

  a2-conformance:
    paths: []
    exclusive: []
