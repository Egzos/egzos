name: release
# Third-party actions are SHA-pinned (Chief decision, 2026-09-06); Dependabot proposes bumps, the Chief commits them.
# Publishes the open core to PyPI when the Chief publishes a GitHub release. Cutting the release is
# the human act; this workflow only carries it out. Trusted publishing (OIDC): no PyPI token exists
# anywhere. PyPI trusts this workflow, in the `pypi` environment, to upload the project `egzos`.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tag is the release's name: a tag that disagrees with the package's version is refused
      # before anything is built, so PyPI never gets a version the tag did not promise.
      - name: version-matches-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$TAG" == "v$VERSION" ]] || { echo "tag $TAG is not v$VERSION"; exit 1; }

      # The toolchain is hash-locked and the build is not isolated, so the backend that builds
      # the published files is the locked one, not whatever an isolated env resolves that day.
      - name: build
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: \
            -r .github/release-requirements.txt
          python -m build --no-isolation

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment PyPI's trusted publisher names. A required reviewer on it (the Chief) makes
    # the upload wait for one more human yes after the release is published.
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
