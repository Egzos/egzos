name: tests
# Third-party actions are SHA-pinned (Chief decision, 2026-09-06); Dependabot proposes bumps, the Chief commits them.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

env:
  MODEL_OPUS: claude-opus-5-5
  MODEL_SONNET: claude-sonnet-5
  MODEL_HAIKU: claude-haiku-4-5-20251001

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # v0.7 §AF (D13): the Postgres backend's case runs in this required check. A throwaway
    # database inside the job; its password is not a secret, and no secret reaches this job.
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: egzos-ci
          POSTGRES_DB: egzos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d egzos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EGZOS_TEST_POSTGRES: postgresql://postgres:egzos-ci@localhost:5432/egzos
    steps:
      # Every required check takes its controls from the base and diffs against it, so a run against
      # any other base says nothing about a merge into the default branch. No pull_request workflow
      # here subscribes to `edited`, so a PR retargeted with `gh pr edit --base` would carry that
      # run's result back to the default branch (#99). Fail every run whose base is elsewhere.
      - name: base-is-default-branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::base is ${BASE_REF}, not ${DEFAULT_BRANCH}: required checks run only for PRs into the default branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e ".[dev,postgres]"

      - name: lint
        run: ruff check .

      - name: pytest
        run: pytest -q

      # pyproject.toml declares requires-python >= 3.11, so the floor runs as well (#10 F27). It is
      # a second interpreter in the same job, not a matrix: the required check is named `tests`, and
      # a matrix would rename it to `tests (3.11)` / `tests (3.12)`, which branch protection would
      # never see.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: pytest on the requires-python floor
        run: |
          python -m venv /tmp/floor
          /tmp/floor/bin/pip install -e ".[dev,postgres]"
          /tmp/floor/bin/pytest -q
