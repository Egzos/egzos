name: ownership-check
# Third-party actions are SHA-pinned (Chief decision, 2026-09-06); Dependabot proposes bumps, the Chief commits them.

on:
  pull_request:
    # labeled/unlabeled: applying or removing `size-exception` must re-decide the check without a
    # push, since a push voids any approval (drift F19).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MODEL_OPUS: claude-opus-5-5
  MODEL_SONNET: claude-sonnet-5
  MODEL_HAIKU: claude-haiku-4-5-20251001

jobs:
  ownership:
    name: ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the label events that name who applied size-exception
      issues: read
    steps:
      # Every required check takes its controls from the base and diffs against it, so a run against
      # any other base says nothing about a merge into the default branch. No pull_request workflow
      # here subscribes to `edited`, so a PR retargeted with `gh pr edit --base` would carry that
      # run's result back to the default branch (#99). Fail every run whose base is elsewhere.
      - name: base-is-default-branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::base is ${BASE_REF}, not ${DEFAULT_BRANCH}: required checks run only for PRs into the default branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install-pyyaml
        run: pip install pyyaml

      # The gate must come from the BASE, never from the tree under review. checkout gives us the
      # PR's own files, so resolving either the checker or OWNERSHIP.yml relatively let a PR supply
      # the rules it is judged by: changing `branch_prefix` alone flipped is_agent_branch to false,
      # which skips chief_only, skips every per-agent path rule including other agents' exclusive
      # paths, and downgrades the size cap from a hard fail to a warning. The chief_only rule that
      # should have blocked editing OWNERSHIP.yml is itself gated on is_agent_branch, so the file
      # decided whether it was allowed to be edited. Both artefacts now come from origin/<base>.
      - name: gate-from-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git show "origin/${BASE_REF}:.github/scripts/check_ownership.py" > /tmp/check_ownership.py
          git show "origin/${BASE_REF}:.github/OWNERSHIP.yml"              > /tmp/OWNERSHIP.base.yml
          test -s /tmp/check_ownership.py
          test -s /tmp/OWNERSHIP.base.yml
          echo "checker and OWNERSHIP.yml taken from origin/${BASE_REF}"

      # The label proves only that someone holding issues: write applied it — egzos-forge does.
      # The checker waives the cap only for an applier listed in OWNERSHIP.yml (drift F18); this
      # step finds who applied it most recently.
      - name: size-exception-applier
        id: applier
        if: contains(github.event.pull_request.labels.*.name, 'size-exception')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LOGIN=$(gh api --paginate "repos/${REPO}/issues/${PR}/events?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "size-exception") | .actor.login' \
            | tail -n 1)
          echo "login=${LOGIN}" >> "$GITHUB_OUTPUT"
          echo "size-exception last applied by: ${LOGIN:-<none found>}"

      - name: check-ownership
        env:
          # Branch names and label names are both attacker-chosen text, and ${{ }}
          # substitution happens before bash parses the line. Labels travel as a JSON array:
          # a comma-joined string let a label name containing a comma spell a second label (#44).
          # Every value is read from the environment, so a base checker that predates one of
          # them still runs. PR_AUTHOR is GitHub's record of who opened the PR, not the PR's text.
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SIZE_EXCEPTION_APPLIER: ${{ steps.applier.outputs.login }}
        run: |
          python3 /tmp/check_ownership.py \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --branch "$HEAD_REF" \
            --ownership /tmp/OWNERSHIP.base.yml
